# Intestazioni di sicurezza HTTP per il Cruscotto HR (Apache 2.4, mod_headers).
# Da includere nel VirtualHost che serve dist/ e fa da reverse proxy verso /auth (strato
# di protezione). Verificare gli indirizzi di Keycloak e della base dati prima dell'uso.
#
# Riferimenti: OWASP Secure Headers Project, OWASP ASVS 4.0 cap. 14.4, Linee guida AgID
# sullo sviluppo del software sicuro.

<IfModule mod_headers.c>
  # HTTPS obbligatorio per 1 anno (attivare solo con HTTPS già configurato su tutto il dominio)
  Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

  # Il browser non deve "indovinare" il tipo dei file
  Header always set X-Content-Type-Options "nosniff"

  # Il Cruscotto non può essere incorporato in pagine di altri siti (clickjacking)
  Header always set X-Frame-Options "DENY"

  # Nessun indirizzo completo inviato ad altri siti
  Header always set Referrer-Policy "strict-origin-when-cross-origin"

  # Funzioni del browser non necessarie disattivate
  Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

  # Isolamento della finestra da altri siti
  Header always set Cross-Origin-Opener-Policy "same-origin"

  # Content Security Policy: solo risorse del Cruscotto, della base dati e di Keycloak.
  #  - script/stili/font/immagini: stessa origine (il font Titillium è incluso nell'app);
  #  - connect-src: base dati (API) e Keycloak; frame-src: Keycloak (controllo sessione);
  #  - 'unsafe-inline' sugli stili: richiesto dai grafici (stili calcolati a runtime).
  # Consiglio: attivare prima in modalità di sola segnalazione
  #   (Content-Security-Policy-Report-Only) per una settimana, poi in modalità bloccante.
  Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api-cr.progetto-gru.it https://identity.progetto-gru.it; frame-src https://identity.progetto-gru.it; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://identity.progetto-gru.it; object-src 'none'; upgrade-insecure-requests"

  # Nessuna informazione sulla versione del server
  Header always unset X-Powered-By
</IfModule>

# Nasconde versione e sistema operativo di Apache nelle risposte e nelle pagine di errore
ServerTokens Prod
ServerSignature Off

# Le mappe dei sorgenti non vanno pubblicate
<FilesMatch "\.map$">
  Require all denied
</FilesMatch>
